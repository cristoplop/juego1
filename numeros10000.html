<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔢 Ordena los Números - Hasta 10.000</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        
        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #a8e6cf, #d0f4de);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        
        .game-container {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        
        h1 { color: #ff6b6b; font-size: 2.8em; margin-bottom: 15px; }

        .instruction-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 25px 0 30px 0;
            flex-wrap: wrap;
        }

        .main-instruction {
            font-size: 2.35em;
            font-weight: 700;
            color: #ff6b6b;
            background: #fff3b0;
            padding: 18px 35px;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            min-height: 80px;
            display: flex;
            align-items: center;
        }

        .order-btn {
            font-size: 1.75em;
            padding: 18px 40px;
            background: #4ecdc4;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .order-btn:hover { transform: scale(1.08); background: #45b8a8; }

        .progress { font-size: 1.5em; background: #ffe66d; padding: 10px 25px; border-radius: 50px; display: inline-block; margin-bottom: 15px; }
        .score { font-size: 1.8em; background: #4ecdc4; color: white; padding: 12px 30px; border-radius: 50px; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        
        .numbers-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            min-height: 180px;
        }
        
        .number-card {
            font-size: 2.8em;
            padding: 25px 35px;
            background: #4ecdc4;
            color: white;
            border-radius: 20px;
            cursor: grab;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            user-select: none;
            transition: all 0.2s;
            min-width: 120px;
        }
        
        .number-card:active { transform: scale(0.92); cursor: grabbing; }
        .number-card.used { opacity: 0.4; pointer-events: none; background: #999; }

        .order-area {
            background: #f8f9fa;
            border: 4px dashed #4ecdc4;
            border-radius: 20px;
            padding: 25px;
            margin: 30px 0;
            min-height: 140px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .slot {
            border: 3px dashed #aaa;
            border-radius: 15px;
            width: 130px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6em;
            background: white;
            transition: all 0.3s;
        }
        
        .slot.filled {
            border-style: solid;
            border-color: #51cf66;
            background: #d0f4de;
        }
        
        .verify-btn {
            background: #ff9ff3;
            font-size: 1.7em;
            padding: 15px 60px;
            border-radius: 50px;
            margin: 15px 10px;
            cursor: pointer;
            border: none;
        }
        
        .reset-btn {
            background: #ff6b6b;
            font-size: 1.5em;
            padding: 12px 40px;
            border-radius: 50px;
            margin: 15px 10px;
            cursor: pointer;
            border: none;
        }
        
        .next-btn {
            background: #51cf66;
            font-size: 1.6em;
            padding: 15px 50px;
            border-radius: 50px;
            display: none;
        }
        
        .feedback {
            font-size: 1.9em;
            margin: 25px 0;
            min-height: 100px;
        }
        
        canvas#confetti { 
            position: fixed; 
            top: 0; left: 0; 
            pointer-events: none; 
            z-index: 100; 
        }
    </style>
</head>
<body>
    <div class="user-profile" id="userProfile" style="display:none; position: fixed; top: 15px; right: 15px; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,0.92); box-shadow: 0 8px 25px rgba(0,0,0,0.12); z-index: 1000;">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar del usuario" style="width:48px; height:48px; border-radius:50%; object-fit:cover; border:3px solid #FF6B00;">
        <p class="user-name" id="userName" style="margin:0; font-weight:bold; font-size:1rem; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">--</p>
    </div>
    <canvas id="confetti"></canvas>
    
    <div class="game-container">
        <h1>🔢 Ordena los Números 🔢</h1>
        
        <div class="instruction-container">
            <div class="main-instruction" id="mainInstruction">
                Ordena los números de menor a mayor
            </div>
            <button class="order-btn" id="orderBtn" onclick="speakCurrentInstruction()">
                📢 Ordena los números de menor a mayor
            </button>
        </div>
        
        <div class="progress">Nivel <span id="current">1</span> de 10</div>
        <div class="score">Puntos: <span id="score">0</span></div>
        
        <div class="numbers-container" id="numbers-container"></div>
        
        <p style="font-size:1.5em; margin:15px 0 10px 0;">👇 Arrastra aquí los números en orden 👇</p>
        <div class="order-area" id="order-area"></div>
        
        <div>
            <button class="verify-btn" id="verifyBtn" onclick="verifyOrder()" disabled>✅ Verificar Orden</button>
            <button class="reset-btn" id="resetBtn" onclick="resetSlots()" style="display: none;">🔄 Reiniciar Casillas</button>
            <button class="next-btn" id="nextBtn" onclick="nextLevel()">¡Siguiente Nivel! →</button>
        </div>
        
        <div class="feedback" id="feedback"></div>
    </div>

    <script>
        let currentLevel = 1;
        let score = 0;
        let selectedNumbers = [];
        let placedNumbers = [];
        let currentCorrectOrder = [];
        let isAscending = true;
        let draggedElement = null;

        const synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9;
            synth.speak(utterance);
        }

        function speakCurrentInstruction() {
            const text = isAscending ? "Ordena los números de menor a mayor" : "Ordena los números de mayor a menor";
            speak(text);
        }

        function generateNumbers() {
            const numbers = new Set();
            while (numbers.size < 5) {
                const num = Math.floor(Math.random() * 9901) + 100;
                numbers.add(num);
            }
            return Array.from(numbers);
        }

        function renderLevel() {
            selectedNumbers = generateNumbers();
            isAscending = Math.random() > 0.5;

            currentCorrectOrder = [...selectedNumbers].sort((a, b) => isAscending ? a - b : b - a);
            placedNumbers = new Array(5).fill(null);

            const instructionText = isAscending ? "Ordena los números de menor a mayor" : "Ordena los números de mayor a menor";
            document.getElementById('mainInstruction').textContent = instructionText;
            document.getElementById('orderBtn').textContent = "📢 " + instructionText;

            // Números disponibles
            const container = document.getElementById('numbers-container');
            container.innerHTML = '';
            selectedNumbers.sort(() => Math.random() - 0.5).forEach(num => {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.textContent = num;
                card.draggable = true;
                card.dataset.value = num;
                card.ondragstart = (e) => {
                    draggedElement = card;
                    e.dataTransfer.setData("text", num);
                    speak(num.toString());
                };
                container.appendChild(card);
            });

            // Slots
            const orderArea = document.getElementById('order-area');
            orderArea.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                slot.ondrop = drop;
                slot.ondragover = allowDrop;
                slot.ondblclick = () => removeFromSlot(slot);
                orderArea.appendChild(slot);
            }

            // Resetear botones
            document.getElementById('verifyBtn').style.display = 'inline-block';
            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('feedback').innerHTML = '';

            speakCurrentInstruction();
        }

        function allowDrop(ev) { ev.preventDefault(); }

        function drop(ev) {
            ev.preventDefault();
            const num = parseInt(ev.dataTransfer.getData("text"));
            const slotIndex = parseInt(ev.currentTarget.dataset.index);
            const slot = ev.currentTarget;

            if (placedNumbers[slotIndex] !== null) {
                const oldNum = placedNumbers[slotIndex];
                document.querySelectorAll('.number-card').forEach(card => {
                    if (parseInt(card.dataset.value) === oldNum) card.classList.remove('used');
                });
            }

            placedNumbers[slotIndex] = num;
            slot.textContent = num;
            slot.classList.add('filled');

            if (draggedElement) draggedElement.classList.add('used');

            // Mostrar botón Reiniciar si ya hay números colocados
            if (placedNumbers.some(n => n !== null)) {
                document.getElementById('resetBtn').style.display = 'inline-block';
            }

            if (placedNumbers.every(n => n !== null)) {
                document.getElementById('verifyBtn').disabled = false;
            }
        }

        function removeFromSlot(slot) {
            const index = parseInt(slot.dataset.index);
            const num = placedNumbers[index];
            if (num === null) return;

            placedNumbers[index] = null;
            slot.textContent = '';
            slot.classList.remove('filled');

            document.querySelectorAll('.number-card').forEach(card => {
                if (parseInt(card.dataset.value) === num) card.classList.remove('used');
            });

            document.getElementById('verifyBtn').disabled = true;
        }

        function resetSlots() {
            placedNumbers = new Array(5).fill(null);
            
            const slots = document.querySelectorAll('.slot');
            slots.forEach(slot => {
                slot.textContent = '';
                slot.classList.remove('filled');
            });

            document.querySelectorAll('.number-card').forEach(card => {
                card.classList.remove('used');
            });

            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('resetBtn').style.display = 'none';
        }

        function verifyOrder() {
            const feedback = document.getElementById('feedback');
            const isCorrect = JSON.stringify(placedNumbers) === JSON.stringify(currentCorrectOrder);

            if (isCorrect) {
                score += 10;
                document.getElementById('score').textContent = score;
                feedback.innerHTML = `¡Perfecto! 🎉<br><strong>¡Muy bien ordenado!</strong>`;
                feedback.style.color = '#51cf66';
                speak("¡Excelente trabajo!");
                launchConfetti();
            } else {
                feedback.innerHTML = `¡Casi! El orden correcto era:<br><strong>${currentCorrectOrder.join(" → ")}</strong>`;
                feedback.style.color = '#ff6b6b';
                speak("Inténtalo de nuevo");
            }

            document.getElementById('verifyBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function launchConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff9ff3', '#51cf66'];

            for (let i = 0; i < 200; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 14 + 8,
                    speed: Math.random() * 7 + 4,
                    rotation: Math.random() * 360,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            let opacity = 1;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let stillAlive = false;
                particles.forEach(p => {
                    p.y += p.speed;
                    p.rotation += 5;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.globalAlpha = opacity;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                    if (p.y < canvas.height + 50) stillAlive = true;
                });
                if (stillAlive && opacity > 0.05) requestAnimationFrame(animate);
            }
            animate();
            setTimeout(() => opacity = 0.5, 1200);
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel > 10) {
                endGame();
                return;
            }
            document.getElementById('current').textContent = currentLevel;
            renderLevel();
        }

        function endGame() {
            // Guardar puntos en localStorage
            const scoreActual = parseInt(localStorage.getItem('score_numeros10000') || '0', 10);
            const totalScore = scoreActual + score;
            localStorage.setItem('score_numeros10000', totalScore);
            
            const container = document.querySelector('.game-container');
            container.innerHTML = `
                <h1>¡Felicidades! 🎊</h1>
                <p style="font-size: 2.6em; margin: 40px 0;">¡Completaste los 10 niveles!</p>
                <p style="font-size: 2.4em;">Puntuación de esta sesión: <strong>${score}</strong> puntos</p>
                <p style="font-size: 2.0em; color: #4ecdc4;">Puntuación total: <strong>${totalScore}</strong> puntos</p>
                <button onclick="irAlLobby()" style="font-size: 1.8em; padding: 20px 70px; margin-top: 30px; background:#4ecdc4; color:white; border:none; border-radius:50px; cursor:pointer;">
                    🏠 Ir al Lobby
                </button>
            `;
        }

        function irAlLobby() {
            window.location.href = 'lobby.html';
        }

        window.onload = () => renderLevel();
    </script>
    <script src="js/profile.js" defer></script>
</body>
</html>
