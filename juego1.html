<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Arrastra los Números - Cuenta las Estrellas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            text-align: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: #FF6B00;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        .user-profile {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.95);
            padding: 10px 14px;
            border-radius: 999px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            z-index: 1000;
        }

        .user-profile img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FF6B00;
        }

        .user-profile .user-name {
            margin: 0;
            font-weight: bold;
            font-size: 1rem;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pregunta {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin: 25px auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            min-height: 440px;
        }

        .objetos {
            min-height: 280px;
            margin: 25px auto;
            position: relative;
            width: 100%;
            max-width: 650px;
            height: 260px;
            border-radius: 20px;
            background-image: url('https://services.meteored.com/img/article/por-que-el-espacio-exterior-es-oscuro-si-esta-repleto-de-estrellas-1708088903182_1280.jpeg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0, 0, 30, 0.85);
            border: 4px solid #0a1f3d;
        }

        .objetos::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 2px);
            background-size: 60px 60px;
            opacity: 0.4;
            pointer-events: none;
        }

        .estrella {
            font-size: 3.9rem;
            position: absolute;
            transition: all 0.4s ease;
            filter: drop-shadow(4px 4px 10px rgba(0,0,0,0.6));
            cursor: pointer;
            user-select: none;
            z-index: 2;
        }

        .estrella.contada {
            color: #FFEE58;
            transform: scale(1.5);
            filter: drop-shadow(0 0 25px #FFFF00) drop-shadow(0 0 12px #FF8C00);
            animation: brillo 1.2s infinite alternate;
        }

        @keyframes brillo {
            from { filter: drop-shadow(0 0 15px #FFEE58); }
            to   { filter: drop-shadow(0 0 30px #FFFF00) drop-shadow(0 0 15px #FF4500); }
        }

        .drop-zone {
            border: 5px dashed #FFCC00;
            border-radius: 20px;
            width: 200px;
            height: 130px;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: bold;
            color: #666;
            background: #fff9e6;
            transition: all 0.3s;
        }

        .drop-zone.correct {
            border-color: #00C853;
            background: #E8F5E9;
        }

        .drop-zone.incorrect {
            border-color: #e74c3c;
            background: #fce8e6;
        }

        .mensaje-juego {
            margin-top: 15px;
            min-height: 40px;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .numeros-draggable {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin: 30px 0;
        }

        .numero {
            width: 95px;
            height: 110px;
            background: #FF6B00;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            cursor: grab;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .numero:hover { transform: scale(1.1); background: #FF4500; }

        .numero-num { font-size: 3rem; font-weight: bold; }
        .numero-nombre { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }

        button {
            margin: 10px 8px;
            padding: 14px 35px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        #verificarBtn { background: #3498db; color: white; }
        #nextBtn { background: #00C853; color: white; display: none; }

        #btnActividad3 {
            background: #FF6B00;
            margin-top: 40px;
            font-size: 1.8rem;
            padding: 18px 50px;
        }
    </style>
</head>
<body>

    <div class="user-profile" id="userProfile" style="display:none;">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar del usuario">
        <p class="user-name" id="userName">--</p>
    </div>

    <div class="contenedor">
        <h1>🧩 ¡Arrastra el Número Correcto!</h1>
        <h2 id="nivel">Pregunta 1 de 10</h2>

        <div class="pregunta">
            <p style="font-size: 1.65rem; color: #2c3e50;">
                Toca las estrellas en cualquier orden y cuenta
            </p>
            
            <div class="objetos" id="objetos"></div>
            
            <div class="drop-zone" id="dropZone" ondrop="drop(event)" ondragover="allowDrop(event)">
                Arrastra aquí
            </div>
            
            <div class="mensaje-juego" id="mensajeJuego"></div>

            <button id="verificarBtn" onclick="verificarRespuesta()" style="display:none;">✅ Verificar</button>
        </div>

        <div class="numeros-draggable" id="numerosContainer"></div>

        <button id="nextBtn" onclick="siguiente()">Siguiente →</button>

        <button id="btnActividad3" onclick="window.location.href='actividad2.html'">
            ← Volver a practicar
        </button>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/active_storage/sfx/2702/2702-preview.mp3"></audio>
    <audio id="errorSound" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>
    <canvas id="confetti" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; display:none;"></canvas>

    <script>
        let preguntaActual = 0;
        let ordenNiveles = [];
        let contador = 0;
        let totalEstrellas = 0;
        let numeroArrastrado = null;

        const datosNumeros = [
            { num: 1, palabra: "uno" }, { num: 2, palabra: "dos" },
            { num: 3, palabra: "tres" }, { num: 4, palabra: "cuatro" },
            { num: 5, palabra: "cinco" }, { num: 6, palabra: "seis" },
            { num: 7, palabra: "siete" }, { num: 8, palabra: "ocho" },
            { num: 9, palabra: "nueve" }, { num: 10, palabra: "diez" }
        ];

        function mezclarNiveles() {
            ordenNiveles = [...datosNumeros].sort(() => Math.random() - 0.5);
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 0.88;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
            }
        }

        function crearEstrellas(cantidad) {
            const contenedor = document.getElementById('objetos');
            contenedor.innerHTML = '';
            contador = 0;
            totalEstrellas = cantidad;
            numeroArrastrado = null;

            const posicionesUsadas = [];

            for (let i = 0; i < cantidad; i++) {
                const estrella = document.createElement('span');
                estrella.className = 'estrella';
                estrella.textContent = '⭐';

                let left = 8 + Math.random() * 82;
                let top = 12 + Math.random() * 68;

                while (posicionesUsadas.some(p => 
                    Math.sqrt(Math.pow(left - p.left, 2) + Math.pow(top - p.top, 2)) < 24)) {
                    left = 8 + Math.random() * 82;
                    top = 12 + Math.random() * 68;
                }
                posicionesUsadas.push({left, top});

                const rotation = Math.random() * 70 - 35;
                const size = 3.5 + Math.random() * 1.6;

                estrella.style.left = `${left}%`;
                estrella.style.top = `${top}%`;
                estrella.style.transform = `rotate(${rotation}deg)`;
                estrella.style.fontSize = `${size}rem`;

                estrella.addEventListener('click', () => {
                    if (!estrella.classList.contains('contada')) {
                        contador++;
                        estrella.classList.add('contada');
                        hablar(contador.toString());

                        if (contador === totalEstrellas) {
                            setTimeout(() => {}, 400);
                        }
                    }
                });

                contenedor.appendChild(estrella);
            }
        }

        function generarNumeros() {
            const container = document.getElementById('numerosContainer');
            container.innerHTML = '';
            const shuffled = [...datosNumeros].sort(() => Math.random() - 0.5);
            
            shuffled.forEach(item => {
                const div = document.createElement('div');
                div.className = 'numero';
                div.draggable = true;
                div.innerHTML = `<div class="numero-num">${item.num}</div><div class="numero-nombre">${item.palabra}</div>`;
                div.addEventListener('click', () => hablar(item.palabra));
                div.ondragstart = (e) => e.dataTransfer.setData("text", item.num);
                container.appendChild(div);
            });
        }

        function cargarNivel() {
            const actual = ordenNiveles[preguntaActual];
            document.getElementById('nivel').textContent = `Pregunta ${preguntaActual + 1} de 10`;
            
            const dropZone = document.getElementById('dropZone');
            dropZone.innerHTML = 'Arrastra aquí';
            dropZone.classList.remove('correct', 'incorrect');
            
            document.getElementById('mensajeJuego').textContent = '';
            document.getElementById('verificarBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';

            crearEstrellas(actual.num);
            generarNumeros();
        }

        function allowDrop(ev) { ev.preventDefault(); }

        function drop(ev) {
            ev.preventDefault();
            numeroArrastrado = parseInt(ev.dataTransfer.getData("text"));
            const dropZone = document.getElementById('dropZone');
            dropZone.innerHTML = numeroArrastrado;
            document.getElementById('verificarBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function verificarRespuesta() {
            const actual = ordenNiveles[preguntaActual];
            const dropZone = document.getElementById('dropZone');
            const verificarBtn = document.getElementById('verificarBtn');

            if (numeroArrastrado === actual.num) {
                dropZone.classList.add('correct');
                document.getElementById('correctSound').play();
                hablar("¡Bien hecho!");
                mostrarConfeti();
                document.getElementById('mensajeJuego').innerHTML = `<span style="color:#00C853;">¡Correcto! Excelente 🎉</span>`;
                document.getElementById('nextBtn').style.display = 'inline-block';
                verificarBtn.style.display = 'none';
            } else {
                dropZone.classList.add('incorrect');
                document.getElementById('errorSound').play();
                document.getElementById('mensajeJuego').innerHTML = `<span style="color:#e74c3c;">Incorrecto, inténtalo de nuevo 😊</span>`;
                setTimeout(() => {
                    dropZone.classList.remove('incorrect');
                    document.getElementById('mensajeJuego').textContent = '';
                }, 1800);
            }
        }

        function mostrarConfeti() {
            try { if (window.startConfetti) { window.startConfetti(1500, 180); return; } } catch(e) {}
        }

        function siguiente() {
            if (preguntaActual < 9) {
                preguntaActual++;
                cargarNivel();
            } else {
                // Redirección final
                window.location.href = 'felicitaciones.html';
            }
        }

        window.onload = () => {
            mezclarNiveles();
            cargarNivel();
        };
        
    </script>
    <script src="js/profile.js" defer></script>
</body>
</html>
